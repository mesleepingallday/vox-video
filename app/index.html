const PRE = 0.6, AUDIO_DUR = 912.82, TOTAL = AUDIO_DUR + PRE;
for (const k in TM) { const s = TM[k]; if (k !== '0') s.t0 += PRE; s.t1 += PRE; s.words.forEach(w => { if (k !== '0') w[1] += PRE; }); }
TM['0'].words.forEach((w, i, a) => { w[1] = PRE * i / a.length; });

<script>
buildAll();
window.seek = seek;
// fonts and every paper texture loaded, so no frame shows fallback type or blank paper
window.READY = document.fonts.ready.then(() => {
  const urls = new Set(); for (const el of document.querySelectorAll('.bg,.pp')) { const m = /url\("?([^")]+)"?\)/.exec(el.style.backgroundImage); if (m) urls.add(m[1]); }
  window.TEX = [...urls].map(u => { const im = new Image(); im.src = u; return im; });  // kept referenced so decoded copies stay cached
  return Promise.all(TEX.map(im => im.decode().catch(() => 0)));
}).then(() => Promise.all(['700 40px Display', '800 40px Display', '400 40px Serif', 'italic 400 40px Serif', '700 40px Serif', 'italic 700 40px Serif',
  '400 40px Mono', '700 40px Mono', '500 40px Label', '600 40px Label', '400 40px Marker', '500 40px Pen', '700 40px Pen'].map(f => document.fonts.load(f, 'AaZz09$%€'))
  .concat(document.fonts.load('900 40px CJK', '腾讯深圳精神鸦片微信豪赌帝国北京华府剥离博弈意义马')))).then(() => document.fonts.ready).then(() => true);
const q = new URLSearchParams(location.search);
if (q.has('t')) seek(+q.get('t'));
if (q.has('preview')) {
  // browser preview: plays the voiceover and follows it; scales the stage to the window
  const st = document.getElementById('stage'), ui = document.getElementById('ui'), sc = document.getElementById('scrub'), tc = document.getElementById('tc');
  ui.style.display = 'flex'; sc.max = TOTAL;
  const fit = () => { const k = Math.min(innerWidth / 1920, (innerHeight - 40) / 1080); st.style.transform = `scale(${k})`; }; fit(); addEventListener('resize', fit);
  const au = new Audio('../input/voice.mp3'); au.currentTime = Math.max(0, +(q.get('t') || 0) - PRE);
  document.getElementById('play').onclick = () => au.paused ? au.play() : au.pause();
  sc.oninput = () => { au.currentTime = Math.max(0, +sc.value - PRE); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); au.paused ? au.play() : au.pause(); } if (e.code === 'ArrowLeft') au.currentTime -= 5; if (e.code === 'ArrowRight') au.currentTime += 5; });
  const loop = () => { const T = au.currentTime + PRE; seek(T); sc.value = T; tc.textContent = T.toFixed(2); requestAnimationFrame(loop); }; loop();
}
